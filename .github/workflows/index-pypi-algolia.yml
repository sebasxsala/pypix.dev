name: index-pypi-algolia

on:
  workflow_dispatch:
    inputs:
      target-records:
        description: 'Optional target record count for indexing runs'
        required: false
        type: string
      mode:
        description: 'Indexing mode: balanced or refresh-listed'
        required: false
        default: balanced
        type: choice
        options:
          - balanced
          - refresh-listed

permissions:
  contents: read

jobs:
  index:
    name: Index PyPI packages in Algolia
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    concurrency:
      group: index-pypi-algolia
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@8ecb39174989ce55af90f45cf55b02738599831d # v1.6.0
        with:
          node-version: lts/*
          run-install: false

      - name: Install dependencies
        run: vp install --filter . --ignore-scripts

      - name: Index PyPI packages
        run: pnpm index:pypi:algolia
        env:
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME || 'pypix_packages' }}
          PYPI_INDEX_BATCH_SIZE: ${{ vars.PYPI_INDEX_BATCH_SIZE || '100' }}
          PYPI_INDEX_CONCURRENCY: ${{ vars.PYPI_INDEX_CONCURRENCY || '5' }}
          PYPI_INDEX_TARGET_RECORDS: ${{ inputs['target-records'] || vars.PYPI_INDEX_TARGET_RECORDS || '90000' }}
          PYPI_INDEX_MODE: ${{ inputs.mode || vars.PYPI_INDEX_MODE || 'balanced' }}
          PYPI_INDEX_PROJECTS_FILE: ${{ vars.PYPI_INDEX_PROJECTS_FILE || 'scripts/pypi-seed-packages.txt' }}
          PYPI_INDEX_SAVE_BATCH_SIZE: ${{ vars.PYPI_INDEX_SAVE_BATCH_SIZE || '1000' }}
          PYPI_INDEX_BATCH_DELAY_MS: ${{ vars.PYPI_INDEX_BATCH_DELAY_MS || '0' }}
          PYPI_INDEX_WAIT_FOR_TASKS: ${{ vars.PYPI_INDEX_WAIT_FOR_TASKS || 'true' }}
